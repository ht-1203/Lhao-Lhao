<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Red background -->
  <rect width="100" height="100" fill="#E8001C"/>

  <!-- Outer yellow border frame -->
  <rect x="8" y="8" width="84" height="84" fill="none" stroke="#FFD200" stroke-width="5"/>

  <!-- Top yellow banner -->
  <rect x="8" y="8" width="84" height="17" fill="#FFD200"/>

  <!-- Bottom yellow banner -->
  <rect x="8" y="75" width="84" height="17" fill="#FFD200"/>

  <!-- Corner dark-red accent squares -->
  <rect x="8"  y="8"  width="11" height="11" fill="#B80015"/>
  <rect x="81" y="8"  width="11" height="11" fill="#B80015"/>
  <rect x="8"  y="81" width="11" height="11" fill="#B80015"/>
  <rect x="81" y="81" width="11" height="11" fill="#B80015"/>

  <!-- LHAO · LHAO in top banner -->
  <text x="50" y="21" text-anchor="middle"
        fill="#B80015" font-family="Georgia,'Times New Roman',serif"
        font-size="8.5" font-weight="bold" letter-spacing="0.5">LHAO · LHAO</text>

  <!-- เหลา (top) -->
  <text x="50" y="53" text-anchor="middle"
        fill="#FFD200" font-family="'Noto Sans Thai','Leelawadee UI',serif"
        font-size="24" font-style="italic" font-weight="bold">เหลา</text>

  <!-- Chopstick divider lines -->
  <line x1="8"  y1="59" x2="92" y2="59" stroke="#FFD200" stroke-width="2.8"/>
  <line x1="8"  y1="64" x2="92" y2="64" stroke="#FFD200" stroke-width="1.6"/>

  <!-- เหลา (bottom) -->
  <text x="50" y="74" text-anchor="middle"
        fill="#FFD200" font-family="'Noto Sans Thai','Leelawadee UI',serif"
        font-size="24" font-style="italic" font-weight="bold">เหลา</text>

  <!-- since 1980 in bottom banner -->
  <text x="50" y="87" text-anchor="middle"
        fill="#B80015" font-family="Georgia,'Times New Roman',serif"
        font-size="7.5" letter-spacing="0.3">since 1980</text>
</svg>
